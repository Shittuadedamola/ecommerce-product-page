<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>e-commerce</title>
</head>
<body>
    <nav class="flex h-[25px] justify-between m-5">
        <div class="flex">
            <section id="hamburger" class="mr-5">
                <div class="w-[20px] h-[3px] bg-black mt-1 mb-1"></div>
                <div class="w-[20px] h-[3px] bg-black mb-1"></div>
                <div class="w-[20px] h-[3px] bg-black"></div>
            </section>
            <img src="images/logo.svg" alt="" class="h-[20px]">
        </div>
        <div class="flex">
            <img src="images/icon-cart.svg" alt="">
            <img src="images/image-avatar.png" alt="" class="ml-5">
        </div>
    </nav>
    <section class="relative">
        <img src="images/image-product-1.jpg" alt="">
        <div class="flex w-[100%] justify-between absolute top-[50%]">
            <div class="bg-white rounded-full w-[35px] h-[35px] flex items-center justify-center ml-5">
                <img src="images/icon-previous.svg" alt="" class="h-[15px]">
            </div>
            <div class="bg-white rounded-full w-[35px] h-[35px] flex items-center justify-center mr-5">
                <img src="images/icon-next.svg" alt="" class="h-[15px]">
            </div>
        </div>
    </section>
    <section class="m-5">
        <h3 class="uppercase text-gray-500">sneaker company</h3>
        <h1 class="capitalize font-bold text-[2rem]">fall limited edition sneakers</h1>
        <p class="normal-case text-gray-400 text-xl text-justify mt-5">These low-profile sneakers are your perfect casual wear companion. 
            Featuring a durable rubber outer sole, they'll withstand everything the weather can offer.
        </p>
    </section>
    <section class="flex justify-between m-5">
        <div class="flex justify-between w-[50%]">
            <div class="text-3xl font-bold">
                <span>$<span>125.00</span></span>
            </div>
            <div class="text-xl font-bold bg-black text-white px-2 rounded">
                <span>50%</span>
            </div>
        </div>
        <div class="line-through text-gray-500 text-xl font-bold">
            <span>$<span>250.00</span></span>
        </div>
    </section>
    <section class="flex justify-between m-5 px-5 rounded-xl items-center h-[50px] bg-blue-100">
        <img src="images/icon-minus.svg" alt="" class="w-[20px] h-[7px]">
        <h1 class="text-2xl font-bold">0</h1>
        <img src="images/icon-plus.svg" alt="" class="w-[20px] h-[20px]">
    </section>
    <section class="flex m-5 px-5 rounded-xl items-center justify-center h-[50px] bg-orange-400 shadow-lg shadow-orange-400">
        <img src="images/icon-cart.svg" alt="" class="w-[25px] h-[25px] mr-5">
        <h1 class="text-xl">Add to cart</h1>
    </section>

    <aside id="navigation" class="h-[100vh] w-[70vw] absolute bg-white top-0 left-0 px-7 py-7 z-50 hidden">
        <img src="images/icon-close.svg" alt="" id="cancelNavigation" class="absolute left-[20px]">
        <div class="flex flex-col h-[270px] justify-between mt-[120px]">
            <a href="" class="text-2xl font-bold">Collections</a>
            <a href="" class="text-2xl font-bold">Men</a>
            <a href="" class="text-2xl font-bold">Women</a>
            <a href="" class="text-2xl font-bold">About</a>
            <a href="" class="text-2xl font-bold">Contact</a>
        </div>
    </aside>
    <div id="overlay"
        class="hidden fixed inset-0 bg-black/50 z-40">
    </div>


    <script>
        const hamburger = document.getElementById("hamburger");
        const cancelNavigation = document.getElementById("cancelNavigation");
        const navigation = document.getElementById("navigation");
        const overlay = document.getElementById("overlay");

        hamburger.addEventListener("click", ()=>{
            navigation.classList.toggle("hidden");
            overlay.classList.toggle("hidden")
        })

        cancelNavigation.addEventListener("click", ()=>{
            navigation.classList.toggle("hidden");
            overlay.classList.toggle("hidden")
        })
    </script>
</body>
</html>
